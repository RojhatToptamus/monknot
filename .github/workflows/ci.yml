name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite runs as three shards on three machines at once; script/test_suite.sh defines them.
    name: Test shard (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [editor, workspace, app]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the build environment and scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ ]] || (( sdk_major < 26 )); then
            echo "macOS 26 SDK or newer is required; found $sdk_version" >&2
            exit 1
          fi
          echo "macOS SDK $sdk_version"
          git diff --check
          bash -n script/*.sh

      - name: Build shipping SwiftPM products in release mode
        if: matrix.shard == 'app'
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product monknot-export
          swift build -c release --product monknot-capture

      - name: Run XCTest shard
        run: script/test_suite.sh "${{ matrix.shard }}"

      - name: Run executable smoke suites and CLI entry points
        if: matrix.shard == 'app'
        shell: bash
        run: |
          set -euo pipefail
          swift run MonknotSmokeTests
          swift run MonknotStoreSmokeTests
          swift run monknot-export --help
          swift run monknot-capture --help

  result:
    # The check `main` requires: it passes only when every shard passed.
    name: Test macOS (arm64)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARDS: ${{ needs.test.result }}
        run: test "$SHARDS" = "success"
