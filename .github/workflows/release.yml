name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require a stable version and approved release ref
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION is not a stable semantic version: $release_version" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            expected_tag="v$release_version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "release tag must point to a commit reachable from origin/main" >&2
              exit 1
            fi
          else
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "manual release dry-runs must use the main branch" >&2
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
              echo "manual release dry-run commit must equal the current origin/main tip" >&2
              exit 1
            fi
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign, notarize, and verify arm64
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DEVELOPER_IDENTITY: "Developer ID Application: rojhat toptamus (ZD35XP4V7D)"
      RELEASE_DMG: dist/Monknot-${{ needs.metadata.outputs.release_version }}-arm64.dmg

    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Record and validate the build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ ]] || (( sdk_major < 26 )); then
            echo "macOS 26 SDK or newer is required; found $sdk_version" >&2
            exit 1
          fi
          echo "macOS SDK $sdk_version"
          git diff --check
          bash -n script/*.sh

      - name: Build shipping SwiftPM products in release mode
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product monknot-export
          swift build -c release --product monknot-capture

      - name: Run XCTest suite
        run: swift test

      - name: Run executable smoke suites and CLI entry points
        shell: bash
        run: |
          set -euo pipefail
          swift run MonknotSmokeTests
          swift run MonknotStoreSmokeTests
          swift run MonknotRecentWorkspaceSmokeTests
          swift run MonknotShortcutSmokeTests
          swift run MonknotWorkspaceExport
          swift run monknot-export --help
          swift run monknot-capture --help

      - name: Import Developer ID certificate and create signed DMG
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          certificate_path="$RUNNER_TEMP/monknot-developer-id.p12"
          keychain_path="$RUNNER_TEMP/monknot-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          original_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            [[ -n "$keychain" ]] || continue
            original_keychains+=("$keychain")
          done < <(security list-keychains -d user)

          cleanup_signing() {
            rm -f "$certificate_path"
            if (( ${#original_keychains[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          }
          trap cleanup_signing EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"

          identity_count="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -v identity="$DEVELOPER_IDENTITY" 'index($0, "\"" identity "\"") { count++ } END { print count + 0 }'
          )"
          if [[ "$identity_count" != "1" ]]; then
            echo "temporary keychain does not contain exactly one expected Developer ID identity" >&2
            exit 1
          fi

          MONKNOT_DEVELOPER_ID_IDENTITY="$DEVELOPER_IDENTITY" \
            script/release_package.sh \
              --identity "$DEVELOPER_IDENTITY" \
              --skip-notarize \
              --version "${{ needs.metadata.outputs.release_version }}" \
              --build-number 1 \
              --dmg "$RELEASE_DMG"

          test -s "$RELEASE_DMG"

      - name: Clean temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/monknot-developer-id.p12"
          security delete-keychain "$RUNNER_TEMP/monknot-signing.keychain-db" >/dev/null 2>&1 || true

      - name: Submit DMG for notarization and staple ticket
        id: notarize
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077

          api_key_path="$RUNNER_TEMP/monknot-notary-api-key.p8"
          result_path="$RUNNER_TEMP/monknot-notary-result.json"
          cleanup_notary() {
            rm -f "$api_key_path" "$result_path"
          }
          trap cleanup_notary EXIT

          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          xcrun notarytool submit "$RELEASE_DMG" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json > "$result_path"

          notary_status="$(plutil -extract status raw -o - "$result_path")"
          notary_id="$(plutil -extract id raw -o - "$result_path")"
          if [[ "$notary_status" != "Accepted" ]]; then
            echo "Apple notarization did not return Accepted (status: $notary_status)" >&2
            exit 1
          fi
          echo "Apple notarization Accepted (submission: $notary_id)"
          echo "submission_id=$notary_id" >> "$GITHUB_OUTPUT"
          rm -f "$api_key_path"

          xcrun stapler staple "$RELEASE_DMG"
          xcrun stapler validate "$RELEASE_DMG"
          spctl --assess --type open --context context:primary-signature -vv "$RELEASE_DMG"

          (
            cd "$(dirname "$RELEASE_DMG")"
            shasum -a 256 "$(basename "$RELEASE_DMG")" > "$(basename "$RELEASE_DMG").sha256"
          )

      - name: Clean temporary notarization material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/monknot-notary-api-key.p8" "$RUNNER_TEMP/monknot-notary-result.json"

      - name: Verify final signed and notarized artifact
        shell: bash
        run: |
          set -euo pipefail
          script/release_preflight.sh --allow-missing-identity
          script/verify_release_artifact.sh \
            --expected-version "${{ needs.metadata.outputs.release_version }}" \
            --expected-build 1 \
            --expected-arch arm64 \
            "$RELEASE_DMG"

      - name: Record successful non-publishing dry-run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          NOTARY_SUBMISSION_ID: ${{ steps.notarize.outputs.submission_id }}
        run: |
          set -euo pipefail
          test -s "$RELEASE_DMG"
          {
            echo "## Release dry-run succeeded"
            echo
            echo "Version: ${{ needs.metadata.outputs.release_version }}"
            echo "Artifact: $(basename "$RELEASE_DMG")"
            echo "Notarization submission: $NOTARY_SUBMISSION_ID"
            echo "No tag or GitHub Release was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release with final DMG
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          notes_file="$RUNNER_TEMP/monknot-release-notes.md"
          test -s "$RELEASE_DMG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "refusing to replace an existing GitHub Release: $tag" >&2
            exit 1
          fi
          {
            echo "Monknot $RELEASE_VERSION is the first public release for Apple silicon Macs."
            echo
            echo "It brings Markdown and text editing, Markdown and HTML previews, PDF viewing and search, workspace search, Markdown-to-PDF export, themes, and an embedded local terminal into one native workspace."
            echo
            echo "Requires macOS 14 or later. This release is Developer ID signed and notarized by Apple."
          } > "$notes_file"
          gh release create "$tag" "$RELEASE_DMG" \
            --verify-tag \
            --title "Monknot $RELEASE_VERSION" \
            --notes-file "$notes_file"
