name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish verified assets as a GitHub prerelease for update testing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a stable version and approved release ref
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_version="$(tr -d '\r\n' < VERSION)"
          build_number="$(tr -d '\r\n' < BUILD_NUMBER)"
          if [[ ! "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION is not a stable semantic version: $release_version" >&2
            exit 1
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "BUILD_NUMBER must be a positive integer: $build_number" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            expected_tag="v$release_version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "release tag must point to a commit reachable from origin/main" >&2
              exit 1
            fi
          else
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "manual release dry-runs must use the main branch" >&2
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$(git rev-parse refs/remotes/origin/main)" ]]; then
              echo "manual release dry-run commit must equal the current origin/main tip" >&2
              exit 1
            fi
          fi

          highest_prior_build=0
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$tag" == "$GITHUB_REF_NAME" ]]; then
              continue
            fi

            prior_build=""
            if git cat-file -e "$tag:BUILD_NUMBER" 2>/dev/null; then
              prior_build="$(git show "$tag:BUILD_NUMBER" | tr -d '\r\n')"
            elif [[ "$tag" == "v0.1.0" ]]; then
              prior_build=1
            fi
            [[ -n "$prior_build" ]] || continue
            if [[ ! "$prior_build" =~ ^[1-9][0-9]*$ ]]; then
              echo "tag $tag has an invalid BUILD_NUMBER: $prior_build" >&2
              exit 1
            fi
            if (( prior_build > highest_prior_build )); then
              highest_prior_build="$prior_build"
            fi
          done < <(git tag --list 'v[0-9]*')

          expected_build=$((highest_prior_build + 1))
          if (( build_number != expected_build )); then
            echo "BUILD_NUMBER must increase exactly once: found $build_number, expected $expected_build" >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign, notarize, and verify arm64
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 360
    environment: release
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DEVELOPER_IDENTITY: "Developer ID Application: rojhat toptamus (ZD35XP4V7D)"
      RELEASE_DMG: dist/Monknot-${{ needs.metadata.outputs.release_version }}-arm64.dmg
      RELEASE_APPCAST: dist/appcast.xml

    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record and validate the build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          if [[ ! "$sdk_major" =~ ^[0-9]+$ ]] || (( sdk_major < 26 )); then
            echo "macOS 26 SDK or newer is required; found $sdk_version" >&2
            exit 1
          fi
          echo "macOS SDK $sdk_version"
          git diff --check
          bash -n script/*.sh

      - name: Build shipping SwiftPM products in release mode
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product monknot-export
          swift build -c release --product monknot-capture

      - name: Run XCTest suite
        run: swift test

      - name: Run executable smoke suites and CLI entry points
        shell: bash
        run: |
          set -euo pipefail
          swift run MonknotSmokeTests
          swift run MonknotStoreSmokeTests
          swift run MonknotRecentWorkspaceSmokeTests
          swift run MonknotShortcutSmokeTests
          swift run MonknotWorkspaceExport
          swift run monknot-export --help
          swift run monknot-capture --help

      - name: Import Developer ID certificate and create signed DMG
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          certificate_path="$RUNNER_TEMP/monknot-developer-id.p12"
          keychain_path="$RUNNER_TEMP/monknot-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          original_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            [[ -n "$keychain" ]] || continue
            original_keychains+=("$keychain")
          done < <(security list-keychains -d user)

          cleanup_signing() {
            rm -f "$certificate_path"
            if (( ${#original_keychains[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          }
          trap cleanup_signing EXIT

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$certificate_path"
          unset MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"

          identity_count="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -v identity="$DEVELOPER_IDENTITY" 'index($0, "\"" identity "\"") { count++ } END { print count + 0 }'
          )"
          if [[ "$identity_count" != "1" ]]; then
            echo "temporary keychain does not contain exactly one expected Developer ID identity" >&2
            exit 1
          fi

          MONKNOT_DEVELOPER_ID_IDENTITY="$DEVELOPER_IDENTITY" \
            script/release_package.sh \
              --identity "$DEVELOPER_IDENTITY" \
              --skip-notarize \
              --version "${{ needs.metadata.outputs.release_version }}" \
              --build-number "${{ needs.metadata.outputs.build_number }}" \
              --dmg "$RELEASE_DMG"

          test -s "$RELEASE_DMG"

      - name: Clean temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/monknot-developer-id.p12"
          security delete-keychain "$RUNNER_TEMP/monknot-signing.keychain-db" >/dev/null 2>&1 || true

      - name: Submit DMG for notarization
        id: notarize
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077

          api_key_path="$RUNNER_TEMP/monknot-notary-api-key.p8"
          submission_path="$RUNNER_TEMP/monknot-notary-submission.json"
          cleanup_notary() {
            rm -f "$api_key_path" "$submission_path"
          }
          trap cleanup_notary EXIT

          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          xcrun notarytool submit "$RELEASE_DMG" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --no-wait \
            --output-format json > "$submission_path"

          notary_id="$(plutil -extract id raw -o - "$submission_path")"
          if [[ ! "$notary_id" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "notarytool did not return a valid submission ID" >&2
            exit 1
          fi

          echo "Apple notarization submitted (submission: $notary_id)"
          echo "submission_id=$notary_id" >> "$GITHUB_OUTPUT"
          echo "Notarization submission: $notary_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Accepted notarization, staple, and assess
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          NOTARY_SUBMISSION_ID: ${{ steps.notarize.outputs.submission_id }}
        run: |
          set -euo pipefail
          umask 077

          api_key_path="$RUNNER_TEMP/monknot-notary-api-key.p8"
          result_path="$RUNNER_TEMP/monknot-notary-result.json"
          cleanup_notary() {
            rm -f "$api_key_path" "$result_path"
          }
          trap cleanup_notary EXIT

          if [[ ! "$NOTARY_SUBMISSION_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "missing or invalid notarization submission ID" >&2
            exit 1
          fi

          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          if ! xcrun notarytool wait "$NOTARY_SUBMISSION_ID" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --timeout 330m \
            --output-format json > "$result_path"; then
            echo "Apple notarization did not finish successfully within the wait window (submission: $NOTARY_SUBMISSION_ID)" >&2
            exit 1
          fi

          notary_status="$(plutil -extract status raw -o - "$result_path")"
          completed_notary_id="$(plutil -extract id raw -o - "$result_path")"
          if [[ "$completed_notary_id" != "$NOTARY_SUBMISSION_ID" ]]; then
            echo "notarytool returned a mismatched submission ID" >&2
            exit 1
          fi
          if [[ "$notary_status" != "Accepted" ]]; then
            echo "Apple notarization did not return Accepted (status: $notary_status)" >&2
            exit 1
          fi
          echo "Apple notarization Accepted (submission: $NOTARY_SUBMISSION_ID)"
          rm -f "$api_key_path"

          xcrun stapler staple "$RELEASE_DMG"
          xcrun stapler validate "$RELEASE_DMG"
          spctl --assess --type open --context context:primary-signature -vv "$RELEASE_DMG"

          (
            cd "$(dirname "$RELEASE_DMG")"
            shasum -a 256 "$(basename "$RELEASE_DMG")" > "$(basename "$RELEASE_DMG").sha256"
          )

      - name: Clean temporary notarization material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/monknot-notary-api-key.p8" "$RUNNER_TEMP/monknot-notary-submission.json" "$RUNNER_TEMP/monknot-notary-result.json"

      - name: Verify final signed and notarized artifact
        shell: bash
        run: |
          set -euo pipefail
          script/release_preflight.sh --allow-missing-identity
          script/verify_release_artifact.sh \
            --expected-version "${{ needs.metadata.outputs.release_version }}" \
            --expected-build "${{ needs.metadata.outputs.build_number }}" \
            --expected-arch arm64 \
            "$RELEASE_DMG"

      - name: Generate and verify the signed Sparkle appcast
        shell: bash
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set +x
          set -euo pipefail
          printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" \
            | env -u SPARKLE_ED25519_PRIVATE_KEY \
                script/generate_appcast.sh "$RELEASE_DMG" RELEASE_NOTES.md "$RELEASE_APPCAST"
          unset SPARKLE_ED25519_PRIVATE_KEY
          script/verify_appcast.sh "$RELEASE_APPCAST"

      - name: Record successful non-publishing dry-run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_prerelease }}
        shell: bash
        env:
          NOTARY_SUBMISSION_ID: ${{ steps.notarize.outputs.submission_id }}
        run: |
          set -euo pipefail
          test -s "$RELEASE_DMG"
          {
            echo "## Release dry-run succeeded"
            echo
            echo "Version: ${{ needs.metadata.outputs.release_version }}"
            echo "Build: ${{ needs.metadata.outputs.build_number }}"
            echo "Artifact: $(basename "$RELEASE_DMG")"
            echo "Appcast: $(basename "$RELEASE_APPCAST")"
            echo "Notarization submission: $NOTARY_SUBMISSION_ID"
            echo "No tag or GitHub Release was created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the verified production artifacts for publishing
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_prerelease }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monknot-production-${{ needs.metadata.outputs.release_version }}
          path: |
            ${{ env.RELEASE_DMG }}
            ${{ env.RELEASE_DMG }}.sha256
            ${{ env.RELEASE_APPCAST }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish verified GitHub Release
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_prerelease }}
    needs:
      - metadata
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_DMG: dist/Monknot-${{ needs.metadata.outputs.release_version }}-arm64.dmg
      RELEASE_APPCAST: dist/appcast.xml

    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the verified production artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: monknot-production-${{ needs.metadata.outputs.release_version }}
          path: dist

      - name: Verify the downloaded artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RELEASE_DMG"
          test -s "$RELEASE_DMG.sha256"
          test -s "$RELEASE_APPCAST"
          (
            cd "$(dirname "$RELEASE_DMG")"
            sha256sum --check "$(basename "$RELEASE_DMG").sha256"
          )

      - name: Publish an atomically verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease || false }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          test -s "$RELEASE_DMG"
          test -s "$RELEASE_DMG.sha256"
          test -s "$RELEASE_APPCAST"
          test -s RELEASE_NOTES.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "refusing to replace an existing GitHub Release: $tag" >&2
            exit 1
          fi

          release_flags=(--draft --title "Monknot $RELEASE_VERSION" --notes-file RELEASE_NOTES.md)
          if [[ "$PUBLISH_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease --target "$GITHUB_SHA")
          else
            release_flags+=(--verify-tag)
          fi

          gh release create "$tag" \
            "$RELEASE_DMG" \
            "$RELEASE_DMG.sha256" \
            "$RELEASE_APPCAST" \
            "${release_flags[@]}"

          verify_dir="$(mktemp -d "$RUNNER_TEMP/monknot-release-assets.XXXXXX")"
          cleanup() {
            rm -rf -- "$verify_dir"
          }
          trap cleanup EXIT

          gh release download "$tag" \
            --dir "$verify_dir" \
            --pattern "$(basename "$RELEASE_DMG")" \
            --pattern "$(basename "$RELEASE_DMG").sha256" \
            --pattern "$(basename "$RELEASE_APPCAST")"

          cmp "$RELEASE_DMG" "$verify_dir/$(basename "$RELEASE_DMG")"
          cmp "$RELEASE_DMG.sha256" "$verify_dir/$(basename "$RELEASE_DMG").sha256"
          cmp "$RELEASE_APPCAST" "$verify_dir/$(basename "$RELEASE_APPCAST")"
          (
            cd "$verify_dir"
            sha256sum --check "$(basename "$RELEASE_DMG").sha256"
          )

          asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
          is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
          if [[ "$asset_count" != "3" || "$is_draft" != "true" ]]; then
            echo "draft release assets were not uploaded atomically" >&2
            exit 1
          fi

          if [[ "$PUBLISH_PRERELEASE" == "true" ]]; then
            gh release edit "$tag" --draft=false --prerelease=true
          else
            gh release edit "$tag" --draft=false --latest
          fi
